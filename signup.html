<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - نظام البوفيه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white max-w-lg w-full">
        <h2 class="text-3xl font-black text-slate-800 text-center mb-6">إنشاء حساب جديد</h2>
        
        <form onsubmit="handleSignup(event)" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">الاسم الكامل:</label>
                    <input type="text" id="regName" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">رقم البصمة الفريد:</label>
                    <input type="text" id="regFingerprint" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">القسم / الإدارة:</label>
                    <input type="text" id="regDept" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">كلمة المرور:</label>
                    <input type="password" id="regPassword" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">نوع المستخدم:</label>
                <select id="regRole" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="employee">موظف (لطلب المشروبات)</option>
                    <option value="buffet">عامل بوفيه (لتحضير الطلبات)</option>
                    <option value="admin">مدير (للإدارة والتقارير)</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">البوفيه التابع له:</label>
                <select id="regBuffet" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm font-bold focus:ring-2 focus:ring-indigo-500 outline-none">
                    <!-- سيتم ملؤه بواسطة الجافاسكريبت -->
                </select>
            </div>

            <button type="submit" class="w-full bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold p-4 rounded-xl shadow-lg shadow-indigo-500/30 mt-4 transition-all transform hover:-translate-y-0.5">
                إنشاء الحساب
            </button>
        </form>

        <p class="text-center mt-6 text-sm text-slate-500 font-bold">
            لديك حساب بالفعل؟ <a href="index.html" class="text-indigo-600 hover:underline">سجل دخولك هنا</a>
        </p>
    </div>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
