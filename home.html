<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - البوفيه الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

    <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white w-10 h-10 rounded-xl flex items-center justify-center font-bold shadow-md">
                    <i class="fas fa-coffee"></i>
                </div>
                <div>
                    <h1 class="font-black text-lg text-slate-800">مرحباً، <span id="loggedUserName" class="text-orange-500"></span></h1>
                    <p class="text-xs text-slate-500 font-bold" id="userRoleTitle"></p>
                </div>
            </div>
            <button onclick="logout()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold px-4 py-2 rounded-xl transition-all text-sm flex items-center gap-2">
                <i class="fas fa-sign-out-alt"></i> خروج
            </button>
        </div>
    </header>

    <!-- شاشة الموظف -->
    <main id="viewKiosk" class="hidden max-w-6xl mx-auto w-full p-4 md:p-6 flex-1 gap-6 grid grid-cols-1 lg:grid-cols-3">
        <!-- نموذج الطلب -->
        <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden h-fit">
            <div class="bg-slate-900 p-6 text-white">
                <h2 class="text-2xl font-black">اطلب مشروبك ☕</h2>
            </div>
            <form onsubmit="handleEmployeeOrder(event)" class="p-6 space-y-6">
                <div id="kioskItemsGrid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
                <div class="grid grid-cols-2 gap-4">
                    <select id="kioskSugar" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:ring-2 focus:ring-orange-500"><option value="مضبوط">سكر: مضبوط</option><option value="زيادة">سكر: زيادة</option><option value="سادة">سكر: سادة</option></select>
                    <select id="kioskMilk" class="w-full bg-slate-50 border border-slate-200 p-3 rounded-xl focus:ring-2 focus:ring-orange-500"><option value="بدون حليب">بدون حليب</option><option value="مع حليب">مع حليب</option></select>
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold p-4 rounded-xl shadow-lg transition-all">إرسال الطلب الآن</button>
            </form>
        </div>

        <!-- متتبع الطلبات والسجل (Tabs) -->
        <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden h-fit flex flex-col">
            <!-- أزرار التنقل (Tabs) -->
            <div class="flex border-b border-slate-200 bg-slate-50">
                <button id="tabActive" onclick="switchKioskTab('active')" class="flex-1 py-3.5 text-sm font-black border-b-2 border-orange-500 text-orange-600 bg-white transition-all">
                    الطلبات الحالية
                </button>
                <button id="tabHistory" onclick="switchKioskTab('history')" class="flex-1 py-3.5 text-sm font-black border-b-2 border-transparent text-slate-500 hover:bg-slate-100 transition-all">
                    سجل طلباتي
                </button>
            </div>
            
            <!-- محتوى الطلبات الحالية -->
            <div id="kioskActiveContent" class="p-5">
                <div id="employeeOrderTracker" class="space-y-3">
                    <!-- الطلبات الحالية تظهر هنا -->
                </div>
            </div>

            <!-- محتوى سجل الطلبات -->
            <div id="kioskHistoryContent" class="p-5 hidden max-h-96 overflow-y-auto bg-slate-50/50">
                <div id="employeeOrderHistory" class="space-y-2">
                    <!-- الطلبات السابقة تظهر هنا -->
                </div>
            </div>
        </div>
    </main>

    <!-- شاشة عامل البوفيه -->
    <main id="viewBuffet" class="hidden max-w-7xl mx-auto w-full p-4 md:p-6 flex-1">
        <h2 class="text-2xl font-black text-slate-800 mb-6 flex items-center gap-2"><i class="fas fa-concierge-bell text-orange-500"></i> شاشة تحضير الطلبات</h2>
        <div id="buffetOrdersContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4"></div>
    </main>

    <!-- شاشة المدير -->
    <main id="viewManager" class="hidden max-w-7xl mx-auto w-full p-4 md:p-6 flex-1 space-y-6">
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
            <h2 class="text-2xl font-black text-slate-800">لوحة تحكم الإدارة والحسابات</h2>
            <button onclick="exportToExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-500/30 transition-all flex items-center gap-2 text-sm transform hover:-translate-y-0.5">
                <i class="fas fa-file-excel"></i> سحب تقرير الإكسيل (Excel)
            </button>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center"><span class="text-slate-500 font-bold text-sm">إجمالي الطلبات</span><h3 id="mgrStatOrders" class="text-4xl font-black text-slate-800 mt-2">0</h3></div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 text-center"><span class="text-slate-500 font-bold text-sm">إجمالي التكلفة (ج.م)</span><h3 id="mgrStatCosts" class="text-4xl font-black text-emerald-600 mt-2">0</h3></div>
        </div>
        <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 overflow-x-auto">
            <table class="w-full text-right text-sm">
                <thead>
                    <tr class="bg-slate-50 text-slate-600 border-b border-slate-200"><th class="p-3 font-bold">اسم الموظف</th><th class="p-3 font-bold">البوفيه</th><th class="p-3 font-bold">المشروب</th><th class="p-3 font-bold">الملاحظات</th><th class="p-3 font-bold">السعر</th><th class="p-3 font-bold">الوقت</th><th class="p-3 font-bold">الحالة</th></tr>
                </thead>
                <tbody id="managerOrdersTableBody"></tbody>
            </table>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
