<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام البوفيه</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-slate-100 to-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/80 backdrop-blur-xl rounded-3xl p-8 shadow-2xl border border-white max-w-md w-full">
        <div class="text-center mb-8">
            <div class="bg-gradient-to-tr from-orange-500 to-red-500 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl shadow-lg mb-4">
                <i class="fas fa-mug-hot"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800">نظام البوفيه الذكي</h1>
            <p class="text-slate-500 text-sm mt-2">تسجيل الدخول للموظفين والإدارة</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">رقم البصمة:</label>
                <input type="text" id="loginFingerprint" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">كلمة المرور:</label>
                <input type="password" id="loginPassword" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3.5 focus:ring-2 focus:ring-orange-500 outline-none transition-all">
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold p-4 rounded-xl shadow-lg shadow-orange-500/30 transition-all transform hover:-translate-y-0.5">
                دخول
            </button>
        </form>
    </div>

    <script src="js/data.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const fp = document.getElementById('loginFingerprint').value.trim();
            const pass = document.getElementById('loginPassword').value;
            const user = employees.find(e => e.fingerprint === fp && e.password === pass);
            if (user) {
                sessionStorage.setItem('currentUser', JSON.stringify(user));
                window.location.href = 'home.html';
            } else {
                alert('رقم البصمة أو كلمة المرور غير صحيحة!');
            }
        }
    </script>
</body>
</html>
